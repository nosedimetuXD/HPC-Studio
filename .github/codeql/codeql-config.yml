# Applied by .github/workflows/codeql.yml.
# Focus CodeQL security scanning strictly on HPC Studio components,
# excluding upstream VS Code codebase and vendor libraries.

paths:
  - 'extensions/hpc-studio'

paths-ignore:
  - '**/node_modules/**'
  - '**/vendor/**'
  - 'extensions/hpc-studio/media/**/vendor/**'
  - 'extensions/hpc-studio/out/**'
  - 'extensions/hpc-studio/dist/**'
  - 'extensions/hpc-studio/syntaxes/**'
  - 'extensions/hpc-studio/snippets/**'
